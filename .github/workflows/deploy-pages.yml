name: Deploy Jom Main Bahasa to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Restore fixed lesson audio
        uses: actions/cache@v4
        with:
          path: public/audio/lessons
          key: lesson-audio-v1-${{ hashFiles('app/content.ts', 'app/questions.ts', 'scripts/generate-audio.mjs') }}

      - name: Generate and verify fixed lesson audio
        run: |
          python -m pip install edge-tts==7.2.8
          npx tsc app/content.ts app/questions.ts --target ES2020 --module commonjs --moduleResolution node --outDir /tmp/jom-main-audio --skipLibCheck --esModuleInterop --isolatedModules false
          node scripts/validate-content.cjs
          node scripts/generate-audio.mjs

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
